name: Tests

on:
  # Run CI on pull requests only. PR checks already validate the code that
  # will land on master, so a second full run after every merge is redundant.
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code || steps.dispatch.outputs.code }}
    steps:
    - uses: actions/checkout@v4
    # Documentation, images, and other non-code files do not affect the test
    # suite, so skip the expensive jobs for those changes.
    - uses: dorny/paths-filter@v3
      id: filter
      if: github.event_name == 'pull_request'
      with:
        filters: |
          code:
            - '**/*.go'
            - '**/*.proto'
            - 'go.mod'
            - 'go.sum'
            - 'Makefile'
            - '**/testdata/**'
            - 'cmd/hdfs/test/**'
            - '.github/workflows/tests.yml'
            - '.github/scripts/**'
    # Manual runs always exercise the full suite.
    - id: dispatch
      if: github.event_name == 'workflow_dispatch'
      run: echo "code=true" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - hadoop_version: 3.3.6
          - hadoop_version: 3.4.3
          - hadoop_version: 3.4.3
            kerberos: true
            rpc_protection: authentication
            transfer_protection: authentication
          - hadoop_version: 3.4.3
            kerberos: true
            rpc_protection: integrity
            transfer_protection: integrity
          - hadoop_version: 3.4.3
            kerberos: true
            rpc_protection: privacy
            transfer_protection: privacy
          - hadoop_version: 3.4.3
            kerberos: true
            rpc_protection: privacy
            transfer_protection: privacy
            aes: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    # Hadoop 3.4 supports Java 8 and 11; pin 11 rather than relying on the
    # runner's default JDK.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "11"

    # This step installs downloads hadoop and starts a local cluster with one
    # namenode and one datanode. It adds the hadoop binaries to GITHUB_PATH
    # and HADOOP_CONF_DIR to GITHUB_ENV.
    - name: install-hdfs.sh
      run: ./.github/scripts/install-hdfs.sh
      env:
        HADOOP_VERSION: ${{ matrix.hadoop_version }}
        KERBEROS: ${{ matrix.kerberos }}
        RPC_PROTECTION: ${{ matrix.rpc_protection }}
        TRANSFER_PROTECTION: ${{ matrix.transfer_protection }}
        AES: ${{ matrix.aes }}

    # Similarly, this step adds the bats binary to GITHUB_PATH.
    - name: install-bats.sh
      run: ./.github/scripts/install-bats.sh

    - name: fixtures.sh
      run: ./.github/scripts/fixtures.sh

    # Touching the generated proto files ensures that make will not try to
    # regenerate them.
    - name: make
      run: find -name '*.pb.go' -exec touch {} \; && make

    - name: make test
      run: |
        make test

    - name: cat namenode.log
      if: always()
      run: cat /tmp/hdfs/namenode.log

    - name: cat datanode.log
      if: always()
      run: cat /tmp/hdfs/datanode.log

  cross-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    # The library and CLI are pure Go, so every target should compile without
    # requiring cgo or platform-specific toolchains.
    - name: cross-compile
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: "0"
      run: go build ./...

  # A single stable check for branch protection. It succeeds when the code
  # jobs pass, and when they are intentionally skipped for docs-only changes.
  ci-success:
    if: always()
    needs: [changes, test, cross-build]
    runs-on: ubuntu-latest
    steps:
    - name: Verify results
      env:
        CODE: ${{ needs.changes.outputs.code }}
        CHANGES_RESULT: ${{ needs.changes.result }}
        TEST_RESULT: ${{ needs.test.result }}
        CROSS_RESULT: ${{ needs.cross-build.result }}
      run: |
        if [ "$CHANGES_RESULT" != "success" ]; then
          echo "changes job failed"
          exit 1
        fi

        if [ "$CODE" != "true" ]; then
          echo "No source changes; skipping test jobs."
          exit 0
        fi

        if [ "$TEST_RESULT" != "success" ] || [ "$CROSS_RESULT" != "success" ]; then
          echo "test=$TEST_RESULT cross-build=$CROSS_RESULT"
          exit 1
        fi
